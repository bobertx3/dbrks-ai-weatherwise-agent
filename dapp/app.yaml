command:
  - uvicorn
  - app:app
  - --host
  - 0.0.0.0
  - --port
  - "8000"

env:
  - name: TARGET_CATALOG
    value: bldemos
  - name: TARGET_SCHEMA
    value: agentbricks_weatherwise
  - name: TEMP_CEILING_F
    value: "30"
  - name: SERVING_ENDPOINT
    valueFrom: serving-endpoint
  - name: WAREHOUSE_ID
    valueFrom: sql-warehouse
  - name: GENIE_SPACE_ID
    valueFrom: genie-space
