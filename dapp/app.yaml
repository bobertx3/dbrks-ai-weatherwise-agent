command:
  - uvicorn
  - app:app
  - --host
  - 0.0.0.0
  - --port
  - "8000"

env:
  - name: TARGET_CATALOG
    value: bldemos
  - name: TARGET_SCHEMA
    value: agentbricks_weatherwise
  - name: TEMP_CEILING_F
    value: "30"
  - name: SERVING_ENDPOINT
    valueFrom: serving-endpoint
  - name: WAREHOUSE_ID
    valueFrom: sql-warehouse
  - name: GENIE_SPACE_ID
    valueFrom: genie-space
  # Lakebase endpoint path used to mint OAuth database credentials (enables the Lakebase read path)
  - name: LAKEBASE_ENDPOINT
    valueFrom: postgres
  # Postgres schema of the Lakebase synced tables (PGHOST/PGUSER/PGDATABASE come from the `postgres` resource)
  - name: LAKEBASE_SCHEMA
    value: agentbricks_weatherwise
